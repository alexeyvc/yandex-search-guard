services:
  search-guard:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8091:8000"]
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 init.py}
      SEARCH_TOKEN: ${SEARCH_TOKEN:?Run python3 init.py}
      # Explicit legacy import only; operators are stored in SQLite.
      GUARD_USERS_JSON: ${GUARD_USERS_JSON:-}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LLM_JSON_SCHEMA: ${LLM_JSON_SCHEMA:-false}
    volumes: ["guard-data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  guard-data:
